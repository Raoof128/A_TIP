# Alertmanager Configuration for Threat Intelligence Platform
# Handles alert routing, grouping, and notification

global:
  # Default time to wait before sending a notification
  resolve_timeout: 5m

  # SMTP configuration (update with your details)
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'tip-alerts@example.com'
  smtp_auth_username: 'tip-alerts@example.com'
  smtp_auth_password: 'your-password-here'
  smtp_require_tls: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert distribution
route:
  # Default receiver
  receiver: 'team-email'

  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']

  # Wait time before sending initial notification
  group_wait: 30s

  # Wait time before sending notification about new alerts in group
  group_interval: 5m

  # Wait time before sending notification if alert still firing
  repeat_interval: 4h

  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
      continue: true  # Also send to default receiver

    # Database alerts
    - match:
        component: database
      receiver: 'database-team'
      group_wait: 30s

    # Security alerts
    - match:
        component: security
      receiver: 'security-team'
      group_wait: 10s
      repeat_interval: 2h

    # Collection alerts
    - match:
        component: collection
      receiver: 'data-team'
      group_wait: 1m

    # Warning alerts - less frequent
    - match:
        severity: warning
      receiver: 'team-email'
      repeat_interval: 12h

# Inhibition rules - suppress certain alerts when others fire
inhibit_rules:
  # Suppress all other alerts if Elasticsearch is down
  - source_match:
      alertname: 'ElasticsearchDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

  # Suppress yellow status if cluster is red
  - source_match:
      alertname: 'ElasticsearchClusterRed'
    target_match:
      alertname: 'ElasticsearchClusterYellow'
    equal: ['cluster']

  # Suppress high CPU if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'HighCPUUsage'
    equal: ['instance']

# Receiver definitions
receivers:
  # Default email receiver
  - name: 'team-email'
    email_configs:
      - to: 'tip-team@example.com'
        headers:
          Subject: '[TIP] {{ .GroupLabels.alertname }}'
        html: |
          {{ range .Alerts }}
          <h3>{{ .Labels.alertname }}</h3>
          <p><b>Severity:</b> {{ .Labels.severity }}</p>
          <p><b>Component:</b> {{ .Labels.component }}</p>
          <p><b>Summary:</b> {{ .Annotations.summary }}</p>
          <p><b>Description:</b> {{ .Annotations.description }}</p>
          <p><b>Started:</b> {{ .StartsAt }}</p>
          {{ end }}

  # Critical alerts - multiple notification channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'tip-oncall@example.com'
        headers:
          Subject: '🚨 [TIP CRITICAL] {{ .GroupLabels.alertname }}'
        send_resolved: true

    # Slack webhook (configure your webhook URL)
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        channel: '#tip-alerts'
        title: '🚨 Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Labels.severity | toUpper }}*: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

    # PagerDuty (configure your integration key)
    pagerduty_configs:
      - service_key: 'your-pagerduty-integration-key'
        description: '{{ .GroupLabels.alertname }}: {{ .Annotations.summary }}'

  # Database team
  - name: 'database-team'
    email_configs:
      - to: 'database-team@example.com'
        headers:
          Subject: '[TIP Database] {{ .GroupLabels.alertname }}'

  # Security team
  - name: 'security-team'
    email_configs:
      - to: 'security-team@example.com'
        headers:
          Subject: '🔒 [TIP Security] {{ .GroupLabels.alertname }}'

    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        channel: '#security-alerts'
        title: '🔒 Security Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  # Data collection team
  - name: 'data-team'
    email_configs:
      - to: 'data-team@example.com'
        headers:
          Subject: '[TIP Collection] {{ .GroupLabels.alertname }}'

  # Webhook receiver (for custom integrations)
  - name: 'webhook'
    webhook_configs:
      - url: 'http://tip-api:8000/webhooks/alerts'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'alertmanager'
            password: 'your-webhook-password'

  # Null receiver (for alerts to ignore)
  - name: 'null'
