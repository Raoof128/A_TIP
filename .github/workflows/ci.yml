name: Threat Intelligence Platform - CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'

env:
  PYTHON_VERSION: '3.11'
  DOCKER_COMPOSE_VERSION: '2.20.0'

jobs:
  # ==================== CODE QUALITY ====================
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort mypy
          pip install -r requirements.txt

      - name: Run Black (code formatting)
        run: |
          black --check collectors/ enrichment/ correlation/ --line-length=120

      - name: Run isort (import sorting)
        run: |
          isort --check-only collectors/ enrichment/ correlation/

      - name: Run Flake8 (style guide)
        run: |
          flake8 collectors/ enrichment/ correlation/ --max-line-length=120 --count --statistics

      - name: Run Pylint (code analysis)
        run: |
          pylint collectors/ enrichment/ correlation/ --max-line-length=120 --exit-zero

      - name: Run mypy (type checking)
        run: |
          mypy collectors/ enrichment/ correlation/ --ignore-missing-imports || true

  # ==================== SECURITY SCANNING ====================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r collectors/ enrichment/ correlation/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ==================== UNIT TESTS ====================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --cov=collectors \
            --cov=enrichment \
            --cov=correlation \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=test-results.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            htmlcov/

  # ==================== INTEGRATION TESTS ====================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: elasticsearch:8.10.2
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wait for Elasticsearch
        run: |
          for i in {1..30}; do
            curl -s http://localhost:9200/_cluster/health && break
            echo "Waiting for Elasticsearch..."
            sleep 2
          done

      - name: Run integration tests
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: |
          pytest tests/ -m integration -v

  # ==================== DOCKER BUILD ====================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow image
        run: |
          cd docker
          docker-compose build airflow

      - name: Test Docker Compose
        run: |
          cd docker
          docker-compose config

  # ==================== CONFIGURATION VALIDATION ====================
  config-validation:
    name: Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate YAML files
        run: |
          python -c "import yaml; yaml.safe_load(open('config/config.yaml'))"
          python -c "import yaml; yaml.safe_load(open('config/prometheus.yml'))"
          python -c "import yaml; yaml.safe_load(open('config/alert_rules.yml'))"
          python -c "import yaml; yaml.safe_load(open('config/alertmanager.yml'))"

      - name: Run configuration validator
        run: |
          python config/config_validator.py || true

  # ==================== DOCUMENTATION BUILD ====================
  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'

      - name: Lint markdown files
        run: |
          npm install -g markdownlint-cli
          markdownlint '**/*.md' --ignore node_modules || true

  # ==================== BUILD SUMMARY ====================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-scan, unit-tests, integration-tests, docker-build, config-validation]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.lint-and-format.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Build failed!"
            exit 1
          fi
          echo "Build succeeded!"

      - name: Send notification
        if: failure() && github.event_name == 'push'
        run: |
          echo "Build failed for ${{ github.ref }}"
          # Add notification logic here (Slack, email, etc.)

  # ==================== DEPLOYMENT (on main branch) ====================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-summary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          cd docker
          docker-compose build
          docker-compose push

      - name: Deploy to server
        run: |
          echo "Deployment step - configure based on your infrastructure"
          # Add deployment commands here
