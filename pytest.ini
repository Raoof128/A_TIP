[pytest]
# Pytest Configuration for Threat Intelligence Platform

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-config=.coveragerc
    --maxfail=5
    --disable-warnings

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    collectors: tests for collector modules
    enrichment: tests for enrichment modules
    correlation: tests for correlation modules
    requires_api: tests that require API keys
    requires_network: tests that require network access

# Coverage options
[coverage:run]
source =
    collectors
    enrichment
    correlation
omit =
    tests/*
    */__pycache__/*
    */venv/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
